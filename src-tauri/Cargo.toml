[package]
name = "menuforge"
version = "0.1.0"
description = "MenuForge — Windows 右键菜单管理器"
license = "MIT"
repository = "https://github.com/ducaoya/menuforge"
homepage = "https://github.com/ducaoya/menuforge"
authors = ["ducaoya <ducaoya@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "menuforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
png = "0.17"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Environment",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
incremental = false
